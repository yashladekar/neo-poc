name: neo-poc

services:
  postgres:
    image: postgres:17
    container_name: neo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neo"]
      interval: 5s
      timeout: 5s
      retries: 20

  workflow:
    build:
      context: ./apps/workflow
    container_name: neo-workflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/neo
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      WORKFLOW_INTERNAL_TOKEN: dev-internal-token
      DOMAIN_BASE_URL: http://host.docker.internal:3001
    ports:
      - "8081:8081"

volumes:
  pgdata:
